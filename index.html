<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Académica</title>
    <!-- Ícono H Moderno para la App -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'><rect width='256' height='256' rx='50' fill='%231e3a8a'/><path d='M80 64v128M176 64v128M80 128h96' stroke='white' stroke-width='36' stroke-linecap='round' stroke-linejoin='round'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'><rect width='256' height='256' fill='%231e3a8a'/><path d='M80 64v128M176 64v128M80 128h96' stroke='white' stroke-width='36' stroke-linecap='round' stroke-linejoin='round'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
</head>
<body>
    <nav class="barra-navegacion" id="nav-principal">
        <button class="btn-nav activo" onclick="cambiarPestana('universidad')">PUCP</button>
        <button class="btn-nav" onclick="cambiarPestana('ingles')">Inglés</button>
        <button class="btn-nav" onclick="cambiarPestana('pendientes')">Pendientes</button>
        <button class="btn-nav" onclick="cambiarPestana('tarjetas')">Tarjetas</button>
    </nav>

    <!-- PANTALLA PRINCIPAL -->
    <main id="pantalla-principal" class="pantalla">
        <section id="universidad" class="pestana activa">
            <div class="header-seccion">
                <svg class="logo-seccion-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                <h1 class="titulo-seccion">Universidad</h1>
            </div>
            <div id="lista-cursos-universidad" class="contenedor-lista lista-estricta"></div>
        </section>

        <section id="ingles" class="pestana">
            <div class="header-seccion">
                <svg class="logo-seccion-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                <h1 class="titulo-seccion">Británico</h1>
            </div>
            <div id="lista-ciclos-ingles" class="contenedor-lista lista-estricta"></div>
        </section>

        <section id="pendientes" class="pestana">
            <div class="header-seccion">
                <svg class="logo-seccion-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
                <h1 class="titulo-seccion">Pendientes</h1>
            </div>
            <div id="lista-pendientes" class="contenedor-lista"></div>
        </section>

        <section id="tarjetas" class="pestana">
            <div class="header-seccion">
                <svg class="logo-seccion-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                <h1 class="titulo-seccion">Mis Pasajes</h1>
            </div>
            <div class="contenedor-lista">
                <div class="tarjeta-transporte">
                    <div class="tarjeta-header"><span class="linea-roja"></span> Corredor</div>
                    <div class="tarjeta-saldo">S/ <span id="saldo-corredor">10.00</span></div>
                    <button class="btn-viaje" style="margin-bottom: 15px;" onclick="abrirHistorial('corredor')">Ver Movimientos</button>
                    <div style="display:flex; gap:10px;">
                        <button class="btn-texto-azul" onclick="agregarSaldo('corredor')">+ Recarga</button>
                        <button class="btn-viaje" onclick="descontarPasaje('corredor', 1.21)">🚌 Viaje (-1.21)</button>
                    </div>
                </div>
                <div class="tarjeta-transporte">
                    <div class="tarjeta-header"><span class="linea-verde"></span> Tren Eléctrico</div>
                    <div class="tarjeta-saldo">S/ <span id="saldo-tren">5.00</span></div>
                    <button class="btn-viaje" style="margin-bottom: 15px;" onclick="abrirHistorial('tren')">Ver Movimientos</button>
                    <div style="display:flex; gap:10px;">
                        <button class="btn-texto-azul" onclick="agregarSaldo('tren')">+ Recarga</button>
                        <button class="btn-viaje" onclick="descontarPasaje('tren', 0.75)">🚆 Viaje (-0.75)</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- PANTALLA DETALLE (APUNTES O HISTORIAL) -->
    <main id="pantalla-detalle" class="pantalla" style="display: none;">
        <div class="header-detalle">
            <h2 id="titulo-detalle"></h2>
        </div>
        <div id="contenido-detalle" class="contenedor-lista-detalle lista-estricta"></div>
        <input type="file" id="input-imagen" accept="image/*" style="display: none;" onchange="cargarImagen(event)">
    </main>

    <!-- ========================================================= -->
    <!-- CONTROLES FLOTANTES GLOBALES Y CONFIRMACIONES -->
    <!-- ========================================================= -->
    
    <!-- Controles Universidad -->
    <div class="controles-flotantes" id="flotantes-universidad" style="display: none;">
        <button class="btn-cuadrado azul" onclick="agregarCurso()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="btn-cuadrado azul" onclick="activarModoEditar('universidad', 'lista-cursos-universidad')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg></button>
        <button class="btn-cuadrado rojo" onclick="activarModoEliminar('universidad', 'lista-cursos-universidad')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/></svg></button>
    </div>
    <!-- Confirmar Eliminar -->
    <div class="controles-confirmar" id="confirmar-universidad" style="display: none;">
        <button class="boton-largo transparente" onclick="cancelarModoEliminar('universidad', 'lista-cursos-universidad')">Cancelar</button>
        <button class="boton-largo rojo" onclick="confirmarEliminacion('universidad', 'lista-cursos-universidad')">Eliminar Cursos</button>
    </div>
    <!-- Confirmar Editar -->
    <div class="controles-confirmar" id="confirmar-editar-universidad" style="display: none;">
        <button class="boton-largo transparente" onclick="cancelarModoEditar('universidad', 'lista-cursos-universidad')">Cancelar</button>
        <button class="boton-largo azul" onclick="confirmarEdicion('universidad', 'lista-cursos-universidad')">Confirmar</button>
    </div>

    <!-- Controles Inglés -->
    <div class="controles-flotantes" id="flotantes-ingles" style="display: none;">
        <button class="btn-cuadrado azul" onclick="agregarCiclo()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="btn-cuadrado azul" onclick="activarModoEditar('ingles', 'lista-ciclos-ingles')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg></button>
        <button class="btn-cuadrado rojo" onclick="activarModoEliminar('ingles', 'lista-ciclos-ingles')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/></svg></button>
    </div>
    <!-- Confirmar Eliminar -->
    <div class="controles-confirmar" id="confirmar-ingles" style="display: none;">
        <button class="boton-largo transparente" onclick="cancelarModoEliminar('ingles', 'lista-ciclos-ingles')">Cancelar</button>
        <button class="boton-largo rojo" onclick="confirmarEliminacion('ingles', 'lista-ciclos-ingles')">Eliminar Ciclos</button>
    </div>
    <!-- Confirmar Editar -->
    <div class="controles-confirmar" id="confirmar-editar-ingles" style="display: none;">
        <button class="boton-largo transparente" onclick="cancelarModoEditar('ingles', 'lista-ciclos-ingles')">Cancelar</button>
        <button class="boton-largo azul" onclick="confirmarEdicion('ingles', 'lista-ciclos-ingles')">Confirmar</button>
    </div>

    <!-- Controles Pendientes -->
    <div class="controles-flotantes" id="flotantes-pendientes" style="display: none;">
        <button class="btn-cuadrado azul" onclick="agregarPendiente()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="btn-cuadrado azul" onclick="activarModoEditar('pendientes', 'lista-pendientes')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg></button>
        <button class="btn-cuadrado rojo" onclick="borrarSeleccionadosPendientes()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/></svg></button>
    </div>
    <div class="controles-confirmar" id="confirmar-editar-pendientes" style="display: none;">
        <button class="boton-largo transparente" onclick="cancelarModoEditar('pendientes', 'lista-pendientes')">Cancelar</button>
        <button class="boton-largo azul" onclick="confirmarEdicion('pendientes', 'lista-pendientes')">Confirmar</button>
    </div>

    <!-- Controles Detalle (Apuntes) -->
    <div class="controles-flotantes" id="flotantes-detalle" style="display: none;">
        <button class="btn-cuadrado azul" onclick="abrirModalTexto()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 7V4h16v3M12 4v16M8 20h8"/></svg></button>
        <button class="btn-cuadrado azul" onclick="prepararImagen()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></button>
        <button class="btn-cuadrado rojo" onclick="activarModoEliminarDetalle()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/></svg></button>
    </div>
    <div class="controles-confirmar" id="confirmar-detalle" style="display: none;">
        <button class="boton-largo transparente" onclick="cancelarModoEliminarDetalle()">Cancelar</button>
        <button class="boton-largo rojo" onclick="confirmarEliminacionDetalle()">Eliminar Apuntes</button>
    </div>

    <!-- MODALES -->
    <div id="modal-texto" class="modal-overlay" style="display:none;">
        <div class="modal-caja">
            <h3>Agregar Apunte</h3>
            <input type="text" id="input-caja-titulo" placeholder="Título (Opcional)..." class="input-moderno">
            <textarea id="input-caja-texto" placeholder="Escribe tu apunte aquí..." rows="6" class="input-moderno"></textarea>
            <div class="botones-modal">
                <button class="btn-modal-cancelar" onclick="cerrarModalTexto()">Cancelar</button>
                <button class="btn-modal-guardar azul" onclick="guardarTextoDeCaja()">Guardar</button>
            </div>
        </div>
    </div>

    <div id="modal-recorte" class="modal-overlay" style="display:none; flex-direction: column;">
        <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; width:100%;">
            <img id="imagen-a-recortar" style="max-width: 100%; max-height: 100%;">
        </div>
        <div class="footer-recorte">
            <button class="boton-largo rojo" onclick="cancelarRecorte()">Cancelar</button>
            <button class="boton-largo azul" onclick="confirmarRecorte()">Confirmar</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
