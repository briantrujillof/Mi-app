<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Académica</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
</head>
<body>
    <nav class="barra-navegacion">
        <button class="btn-nav activo" onclick="cambiarPestana('universidad')">PUCP</button>
        <button class="btn-nav" onclick="cambiarPestana('ingles')">Inglés</button>
        <button class="btn-nav" onclick="cambiarPestana('pendientes')">Pendientes</button>
        <button class="btn-nav" onclick="cambiarPestana('tarjetas')">Tarjetas</button>
    </nav>

    <!-- PANTALLA PRINCIPAL CON SWIPE -->
    <main id="pantalla-principal">
        
        <section id="universidad" class="pestana activa">
            <div class="header-seccion">
                <img src="pucp-logo.png" alt="PUCP" class="logo-seccion" onerror="this.style.display='none'">
                <h1 class="titulo-seccion">Universidad</h1>
            </div>
            <div id="lista-cursos-universidad" class="contenedor-lista"></div>
            <div class="controles-flotantes">
                <button class="btn-cuadrado azul" onclick="agregarCurso()">+</button>
                <button class="btn-cuadrado rojo" onclick="borrarSeleccionados('lista-cursos-universidad')">-</button>
            </div>
        </section>

        <section id="ingles" class="pestana">
            <div class="header-seccion">
                <img src="britanico-logo.png" alt="Inglés" class="logo-seccion" onerror="this.style.display='none'">
                <h1 class="titulo-seccion">Británico</h1>
            </div>
            <div id="lista-ciclos-ingles" class="contenedor-lista"></div>
            <div class="controles-flotantes">
                <button class="btn-cuadrado azul" onclick="agregarCiclo()">+</button>
                <button class="btn-cuadrado rojo" onclick="borrarSeleccionados('lista-ciclos-ingles')">-</button>
            </div>
        </section>

        <section id="pendientes" class="pestana">
            <div class="header-seccion">
                <!-- Icono SVG serio para tareas -->
                <svg class="logo-seccion-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
                <h1 class="titulo-seccion">Pendientes</h1>
            </div>
            <div id="lista-pendientes" class="contenedor-lista"></div>
            <div class="controles-flotantes">
                <button class="btn-cuadrado azul" onclick="agregarPendiente()">+</button>
                <button class="btn-cuadrado rojo" onclick="borrarSeleccionados('lista-pendientes')">-</button>
            </div>
        </section>

        <section id="tarjetas" class="pestana">
            <div class="header-seccion">
                <!-- Icono SVG serio para tarjetas -->
                <svg class="logo-seccion-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                <h1 class="titulo-seccion">Tarjetas</h1>
            </div>
            <div id="lista-tarjetas" class="contenedor-lista"></div>
            <div class="controles-flotantes">
                <button class="btn-cuadrado azul" onclick="agregarTarjeta()">+</button>
                <button class="btn-cuadrado rojo" onclick="borrarSeleccionados('lista-tarjetas')">-</button>
            </div>
        </section>
    </main>

    <!-- DETALLE DEL CURSO -->
    <main id="pantalla-detalle" style="display: none;">
        <div class="header-detalle">
            <button class="btn-atras" onclick="cerrarDetalle()">← Atrás</button>
            <h2 id="titulo-detalle"></h2>
        </div>
        
        <div id="contenido-detalle" class="contenedor-lista-detalle"></div>
        
        <div class="controles-flotantes">
            <button class="btn-cuadrado azul" onclick="abrirModalTexto()">T</button>
            <button class="btn-cuadrado azul" onclick="prepararImagen()">🖼️</button>
            <button class="btn-cuadrado rojo" onclick="borrarSeleccionadosDetalle()">-</button>
        </div>
        <input type="file" id="input-imagen" accept="image/*" style="display: none;" onchange="cargarImagen(event)">
    </main>

    <!-- Modal Texto -->
    <div id="modal-texto" class="modal-overlay" style="display:none;">
        <div class="modal-caja">
            <h3>Agregar Texto</h3>
            <textarea id="input-caja-texto" placeholder="Escribe tu apunte aquí..." rows="5"></textarea>
            <div class="botones-modal">
                <button class="btn-modal-cancelar" onclick="cerrarModalTexto()">Cancelar</button>
                <button class="btn-modal-guardar" onclick="guardarTextoDeCaja()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal Recorte -->
    <div id="modal-recorte" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:9999; flex-direction: column;">
        <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; overflow: hidden;">
            <img id="imagen-a-recortar" style="max-width: 100%; max-height: 100%;">
        </div>
        <div class="footer-recorte">
            <button class="boton-largo rojo" onclick="cancelarRecorte()">Cancelar</button>
            <button class="boton-largo azul" onclick="confirmarRecorte()">Confirmar</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
