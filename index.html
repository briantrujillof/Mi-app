<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi App Estudiantil</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
</head>
<body>

    <nav class="barra-navegacion">
        <button onclick="cambiarPestana('universidad')">PUCP</button>
        <button onclick="cambiarPestana('ingles')">Inglés</button>
        <button onclick="cambiarPestana('pendientes')">Pendientes</button>
        <button onclick="cambiarPestana('tarjetas')">Tarjetas</button>
    </nav>

    <main id="pantalla-principal">
        <section id="universidad" class="pestana activa">
            <div class="cabecera">
                <img src="pucp.png" alt="PUCP" class="logo" onerror="this.style.display='none'">
                <h2>Universidad</h2>
            </div>
            <button class="boton-agregar" onclick="agregarCurso()">Agregar Curso</button>
            <div id="lista-cursos-universidad" class="contenedor-lista"></div>
            <button class="boton-eliminar-global" onclick="borrarSeleccionados('lista-cursos-universidad')">Eliminar Cursos</button>
        </section>

        <section id="ingles" class="pestana">
            <div class="cabecera">
                <img src="britanico.png" alt="Británico" class="logo" onerror="this.style.display='none'">
                <h2>Británico</h2>
            </div>
            <button class="boton-agregar" onclick="agregarCiclo()">Agregar Ciclo</button>
            <div id="lista-ciclos-ingles" class="contenedor-lista"></div>
            <button class="boton-eliminar-global" onclick="borrarSeleccionados('lista-ciclos-ingles')">Eliminar Ciclos</button>
        </section>

        <section id="pendientes" class="pestana">
            <div class="cabecera">
                <img src="https://cdn-icons-png.flaticon.com/512/906/906334.png" alt="Tareas" class="logo-icono" onerror="this.style.display='none'">
                <h2>Mis Tareas</h2>
            </div>
            <button class="boton-agregar" onclick="agregarPendiente()">Agregar Pendiente</button>
            <div id="lista-pendientes" class="contenedor-lista"></div>
            <button class="boton-eliminar-global" onclick="borrarSeleccionados('lista-pendientes')">Eliminar Pendientes</button>
        </section>

        <section id="tarjetas" class="pestana">
            <div class="cabecera">
                <img src="https://cdn-icons-png.flaticon.com/512/179/179431.png" alt="Tarjetas" class="logo-icono" onerror="this.style.display='none'">
                <h2>Mis Pasajes</h2>
            </div>
            <div class="tarjeta-transporte corredor">
                <h3>Corredor</h3>
                <h1 class="saldo-numero">S/ 10.00</h1>
                <p class="texto-accion" onclick="agregarSaldoCorredor()">Agregar Saldo</p>
                <button class="boton-viaje" onclick="registrarViajeCorredor()">Confirmar Viaje</button>
            </div>
            <div class="tarjeta-transporte tren">
                <h3>Tren Eléctrico</h3>
                <h1 class="saldo-numero">S/ 5.00</h1>
                <p class="texto-accion" onclick="agregarSaldoTren()">Agregar Saldo</p>
                <button class="boton-viaje" onclick="registrarViajeTren()">Confirmar Viaje</button>
            </div>
        </section>
    </main>

    <main id="pantalla-detalle" style="display: none;">
        <div class="cabecera-detalle">
            <button class="boton-volver" onclick="cerrarDetalle()">Atrás</button>
            <h2 id="titulo-detalle">Nombre del Curso</h2>
        </div>
        
        <div id="contenido-detalle"></div>
        
        <input type="file" id="input-imagen" accept="image/*" style="display: none;" onchange="cargarImagen(event)">
        
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="boton-agregar" onclick="agregarBloqueTexto()">Agregar Texto</button>
            <button class="boton-agregar" onclick="prepararImagen()">Agregar Imagen</button>
        </div>
        
        <button class="boton-eliminar-global" onclick="borrarSeleccionadosDetalle()" style="margin-top: 30px;">Eliminar Título</button>
    </main>

    <div id="modal-recorte" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:9999; flex-direction:column;">
        <div style="flex-grow:1; overflow:hidden; display:flex; justify-content:center; align-items:center;">
            <img id="imagen-a-recortar" style="max-width: 100%; max-height: 100%;">
        </div>
        <div style="padding: 20px; text-align:center; background:#16263a;">
            <button class="boton-agregar" style="background-color: #4a90e2; border:none; color:white; margin-bottom: 15px;" onclick="confirmarRecorte()">Confirmar Recorte</button>
            <button class="boton-volver" onclick="cancelarRecorte()" style="color:white; width: 100%;">Cancelar</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
