<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Académica</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
</head>
<body>
    <nav class="barra-navegacion">
        <button onclick="cambiarPestana('universidad')">PUCP</button>
        <button onclick="cambiarPestana('ingles')">Inglés</button>
        <button onclick="cambiarPestana('pendientes')">Pendientes</button>
        <button onclick="cambiarPestana('tarjetas')">Tarjetas</button>
    </nav>

    <main id="pantalla-principal">
        <section id="universidad" class="pestana activa">
            <h1 class="titulo-seccion">Universidad</h1>
            <button class="boton-accion blue" onclick="agregarCurso()">+ Agregar Curso</button>
            <div id="lista-cursos-universidad" class="contenedor-lista"></div>
            <button class="boton-accion red" onclick="borrarSeleccionados('lista-cursos-universidad')">- Eliminar Cursos</button>
        </section>
        <!-- (Las otras secciones siguen la misma estructura) -->
        <section id="ingles" class="pestana">
            <h1 class="titulo-seccion">Británico</h1>
            <button class="boton-accion blue" onclick="agregarCiclo()">+ Agregar Ciclo</button>
            <div id="lista-ciclos-ingles" class="contenedor-lista"></div>
            <button class="boton-accion red" onclick="borrarSeleccionados('lista-ciclos-ingles')">- Eliminar Ciclos</button>
        </section>
        <section id="pendientes" class="pestana">
            <h1 class="titulo-seccion">Pendientes</h1>
            <button class="boton-accion blue" onclick="agregarPendiente()">+ Agregar Pendiente</button>
            <div id="lista-pendientes" class="contenedor-lista"></div>
            <button class="boton-accion red" onclick="borrarSeleccionados('lista-pendientes')">- Eliminar Pendientes</button>
        </section>
        <section id="tarjetas" class="pestana">
            <h1 class="titulo-seccion">Pasajes</h1>
            <!-- Tarjetas aquí -->
        </section>
    </main>

    <main id="pantalla-detalle" style="display: none;">
        <div class="header-detalle">
            <button class="btn-atras" onclick="cerrarDetalle()">← Atrás</button>
            <h2 id="titulo-detalle"></h2>
        </div>
        <div id="contenido-detalle" class="contenedor-lista"></div>
        
        <div class="area-controles">
            <button class="btn-mini blue" onclick="agregarBloqueTexto()">T</button>
            <button class="btn-mini blue" onclick="prepararImagen()">IMG</button>
            <button class="btn-mini red" onclick="borrarSeleccionadosDetalle()">-</button>
        </div>
        <input type="file" id="input-imagen" accept="image/*" style="display: none;" onchange="cargarImagen(event)">
    </main>

    <div id="modal-recorte" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:9999;">
        <img id="imagen-a-recortar" style="max-width: 100%;">
        <div class="footer-recorte">
            <button class="boton-accion blue" onclick="confirmarRecorte()">Confirmar</button>
            <button class="btn-atras" onclick="cancelarRecorte()">Cancelar</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
